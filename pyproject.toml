[project]
name = "market_reserach_agent"
version = "0.1.0"
description = "market_reserach_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "litellm>=1.75.3",
    "selenium>=4.41.0",
    "webdriver-manager>=4.0.2",
    "streamlit>=1.30.0",
    "streamlit-authenticator>=0.4.2",
]

[project.scripts]
market_research_agent = "market_research_agent.main:run"
market_reserach_agent = "market_research_agent.main:run"
run_crew = "market_research_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
